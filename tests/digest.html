<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seed testi</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #15111d; color: #f1edf7; margin: 0; padding: 24px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  code { font-size: 28px; display: block; margin: 8px 0 16px; }
  .ok { color: #7ee08f; } .bad { color: #ff7a7a; } .dim { color: #a79fb6; }
  li { word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>Seed testi</h1>
  <p class="dim">10.000 kodun tamamını üretip kontrol eder. Özet her cihazda aynı çıkmalı.</p>
  <p id="status">Çalışıyor…</p>
  <div id="result"></div>
</main>
<script src="../src/generator.js"></script>
<script src="digest.js"></script>
<script>
  setTimeout(function () {
    var started = performance.now();
    var r = Digest.run(Generator);
    var ms = Math.round(performance.now() - started);
    var golden = r.golden.version === r.version ? r.golden.digest : '';
    var match = golden === r.digest;
    var status = document.getElementById('status');
    status.textContent = r.problems.length ? 'HATA: ' + r.problems.length + ' sorun bulundu'
      : (golden ? (match ? 'GEÇTİ' : 'HATA: özet beklenenden farklı') : 'Kontroller geçti, beklenen özet henüz kaydedilmedi');
    status.className = r.problems.length || (golden && !match) ? 'bad' : 'ok';
    var html = '<code id="digest">' + r.digest + '</code>';
    html += '<p class="dim">Sürüm ' + r.version + ' · ' + ms + ' ms · ' + navigator.userAgent + '</p>';
    if (r.problems.length) {
      html += '<ul>' + r.problems.slice(0, 20).map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>';
    }
    document.getElementById('result').innerHTML = html;
  }, 50);
</script>
</body>
</html>
