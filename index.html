<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#150d20">
<title>Kestane</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Oyun alanı"></canvas>
  <div id="hud" hidden>
    <button id="partner-died" type="button">Ortağım öldü</button>
    <button id="sound" type="button">Ses: açık</button>
  </div>
</div>
<p id="rotate-hint">İşaretleri rahat görmek için telefonu yan çevir.</p>
<div id="screen" hidden></div>
<div id="touch" aria-hidden="true">
  <div class="group">
    <button type="button" data-key="left">←</button>
    <button type="button" data-key="right">→</button>
  </div>
  <div class="group">
    <button type="button" data-key="action" class="door-only">Gir</button>
    <button type="button" data-key="jump" class="jump">Zıpla</button>
  </div>
</div>
<script src="src/generator.js"></script>
<script src="src/engine.js"></script>
<script src="src/glyphs.js"></script>
<script src="src/rooms.js"></script>
<script src="src/app.js"></script>
</body>
</html>
